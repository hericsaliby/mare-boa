name: Dados EPAGRI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/epagri.yml", "tools/historico.py", "tools/mares.py", "tools/coleta_epagri.py", "tools/temp_mar.py", "tools/estacoes.json"]
permissions:
  contents: read
concurrency: epagri
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # só para atualizar o branch "dados"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copia os marégrafos da EPAGRI para o branch "dados" e mantém o histórico
        run: |
          git clone -q --depth 1 -b dados "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" old || mkdir -p old
          mkdir out
          python3 tools/coleta_epagri.py old out
          python3 tools/historico.py old out
          python3 tools/temp_mar.py old out || true
          pip install -q utide numpy >/dev/null 2>&1 || true
          python3 tools/mares.py old out || true
          # arquivos do robô de modelos (outro workflow) seguem como estão
          for f in modelos.json mar.json modelos_log.txt relevo.json agua.png modelos_base.json.gz modelos_sc.json modelos_pr.json modelos_sp.json mar_sc.json mar_pr.json mar_sp.json relevo_sc.json relevo_pr.json relevo_sp.json agua_sc.png agua_pr.png agua_sp.png; do cp "old/$f" out/ 2>/dev/null || true; done
          BASE=$(git -C old rev-parse HEAD 2>/dev/null || echo "")
          date -u +%FT%TZ > out/atualizado.txt
          cd out
          git init -q -b dados
          git add -A
          git -c user.name=mare-boa-bot -c user.email=mare-boa-bot@users.noreply.github.com commit -qm "Dados EPAGRI $(cat atualizado.txt)"
          # só substitui se ninguém gravou no meio (senão tenta de novo em 15 min)
          git push -q --force-with-lease="dados:$BASE" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dados || echo "dados mudou durante a coleta; fica para a próxima"
