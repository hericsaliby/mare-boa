name: Dados EPAGRI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/epagri.yml"]
permissions:
  contents: write
concurrency: epagri
jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - name: Copia os marégrafos da EPAGRI para o branch "dados"
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          for e in "floripa getDataMare3_2951" "imbituba getDataMare6_2963"; do set -- $e
            curl -sS -A "$UA" -H "Origin: https://hericsaliby.github.io" -H "Referer: https://hericsaliby.github.io/" \
              -D "$1.headers.txt" -m 60 "https://ciram.epagri.sc.gov.br/graficos/$2.php" -o "$1.json" || true
          done
          date -u +%FT%TZ > atualizado.txt
          ls -la
          git init -q -b dados
          git add -A
          git -c user.name=mare-boa-bot -c user.email=mare-boa-bot@users.noreply.github.com commit -qm "Dados EPAGRI $(cat atualizado.txt)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dados
