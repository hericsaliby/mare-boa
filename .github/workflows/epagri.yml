name: Dados EPAGRI
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/epagri.yml", "tools/historico.py"]
permissions:
  contents: read
concurrency: epagri
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # só para atualizar o branch "dados"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copia os marégrafos da EPAGRI para o branch "dados" e mantém o histórico
        run: |
          git clone -q --depth 1 -b dados "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" old || mkdir -p old
          mkdir out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          for e in "floripa getDataMare3_2951" "imbituba getDataMare6_2963"; do set -- $e
            curl -sS -A "$UA" -D "out/$1.headers.txt" -m 60 "https://ciram.epagri.sc.gov.br/graficos/$2.php" -o "out/$1.json" || true
          done
          if [ ! -f old/tabua.html ]; then curl -sSL -A "$UA" -m 60 "https://ciram.epagri.sc.gov.br/index.php/tabua-de-mares/" -o out/tabua.html || true; else cp old/tabua.html out/; fi
          if [ ! -f old/tabuamare.html ]; then curl -sSL -A "$UA" -m 60 "https://ciram.epagri.sc.gov.br/ciram_arquivos/oceano/tabuamare/tabuamare.html" -o out/tabuamare.html || true; else cp old/tabuamare.html out/; fi
          for c in Florianopolis Imbituba; do
            curl -sSL -A "$UA" -D "out/tabua_$c.headers.txt" -m 60 "https://ciram.epagri.sc.gov.br/ciram_arquivos/oceano/tabuamare/csv/Tabua_Mare_$c.csv" -o "out/tabua_$c.csv.new" || true
            if [ -s "out/tabua_$c.csv.new" ] && ! grep -qi "<html" "out/tabua_$c.csv.new"; then mv "out/tabua_$c.csv.new" "out/tabua_$c.csv"; else rm -f "out/tabua_$c.csv.new"; cp "old/tabua_$c.csv" out/ 2>/dev/null || true; fi
          done
          python3 tools/historico.py old out
          # arquivos do robô de modelos (outro workflow) seguem como estão
          for f in modelos.json mar.json modelos_log.txt relevo.json agua.png; do cp "old/$f" out/ 2>/dev/null || true; done
          BASE=$(git -C old rev-parse HEAD 2>/dev/null || echo "")
          date -u +%FT%TZ > out/atualizado.txt
          cd out
          git init -q -b dados
          git add -A
          git -c user.name=mare-boa-bot -c user.email=mare-boa-bot@users.noreply.github.com commit -qm "Dados EPAGRI $(cat atualizado.txt)"
          # só substitui se ninguém gravou no meio (senão tenta de novo em 15 min)
          git push -q --force-with-lease="dados:$BASE" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dados || echo "dados mudou durante a coleta; fica para a próxima"
