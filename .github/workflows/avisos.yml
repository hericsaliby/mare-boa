name: Avisos no celular
on:
  schedule:
    - cron: "40 14 * * *"   # 11h40 em Brasília: frente fria
    - cron: "40 20 * * *"   # 17h40 em Brasília: frente fria e véspera da agenda
  workflow_dispatch:
permissions:
  contents: read
concurrency: avisos
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: Envia frente fria, agenda e respostas do chat
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python3 tools/avisos.py
