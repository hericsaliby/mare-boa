name: Pesquisa de fontes de maré (temporário)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pesquisa.yml"]
permissions:
  contents: read
jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Testa a API do Litoral On-Line (temperatura do mar medida)
        run: |
          mkdir p && cd p
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          B="https://ciram.epagri.sc.gov.br/api/litoral-online-server"
          W="$B/webresources/monitoramentolitoral"
          H=(-A "$UA" -H "Referer: https://ciram.epagri.sc.gov.br/litoral-online/" -H "Origin: https://ciram.epagri.sc.gov.br")
          g(){ curl -sSL "${H[@]}" -m 60 "$2" -o "$1" -w "%{http_code} %{size_download} GET $2\n" >> log.txt 2>&1 || echo "ERRO $2" >> log.txt; }
          p(){ curl -sSL "${H[@]}" -m 60 -H "Content-Type: application/json" -X POST --data "$3" "$2" -o "$1" -w "%{http_code} %{size_download} POST $2 $3\n" >> log.txt 2>&1 || echo "ERRO $2" >> log.txt; }
          p mapa_vazio.json "$W/estacoesMapa" ""
          p mapa_obj.json "$W/estacoesMapa" "{}"
          p mapa_null.json "$W/estacoesMapa" "null"
          g bacias.txt "$B/cache/bacias.txt"
          # códigos das estações que medem temperatura do mar
          python3 - > cods.txt <<'PY' || true
          import json,glob
          for f in glob.glob("mapa_*.json"):
              try:
                  j=json.load(open(f))
                  for e in j.get("estacoes",[]):
                      if e.get("temperaturaMar")=="s" or e.get("auxiliar")=="n": print(e.get("estacao"))
                  break
              except Exception: pass
          PY
          sort -u cods.txt -o cods.txt; echo "códigos: $(cat cods.txt | tr '\n' ' ')" >> log.txt
          for c in $(head -30 cods.txt) 2951 2963; do
            p "gs_$c.json" "$W/variaveisGrafSemana" "{\"cdEstac\":$c,\"variaveis\":[381,382]}"
            g "c_${c}381semana.txt" "$B/cache/${c}381semana.txt"
            g "c_${c}382semana.txt" "$B/cache/${c}382semana.txt"
            p "gd_$c.json" "$W/variaveisGrafDia" "{\"cdEstac\":$c,\"variaveis\":[381,382]}"
            g "c_${c}381.txt" "$B/cache/${c}381.txt"
            g "e_$c.json" "$W/$c"
          done
          ls -la >> log.txt
      - name: Grava no branch "pesquisa"
        run: |
          cd p && git init -q -b pesquisa && git add -A
          git -c user.name=mare-boa-bot -c user.email=mare-boa-bot@users.noreply.github.com commit -qm "pesquisa $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" pesquisa
