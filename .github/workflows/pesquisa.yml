name: Pesquisa de fontes de maré (temporário)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pesquisa.yml"]
permissions:
  contents: read
jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Baixa a página de temperatura da superfície do mar da EPAGRI e o que ela carrega
        run: |
          mkdir p && cd p
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          g(){ curl -sSL -A "$UA" -m 60 "$2" -o "$1" -w "%{http_code} %{size_download} $2\n" >> log.txt 2>&1 || echo "ERRO $2" >> log.txt; }
          g tsm.html "https://ciram.epagri.sc.gov.br/index.php/temperatura-da-superficie-do-mar/"
          # tudo que parece dado, imagem de mapa, script de gráfico ou iframe
          grep -oE '(src|href|url|data-src)=["'"'"'][^"'"'"']+' tsm.html | sed -E 's/^[a-z-]+=["'"'"']//' | grep -viE '\.(css|woff2?|ttf)(\?|$)|wp-content/themes|wp-includes|google|facebook|twitter|instagram|youtube|whatsapp' | sort -u > links.txt
          grep -oE 'https?://[^"'"'"' )<>]+' tsm.html | grep -iE 'tsm|sst|temperatura|oceano|mar|getData|graficos|ciram_arquivos|\.json|\.csv|\.png|\.gif|\.jpg|\.nc|php' | sort -u >> links.txt
          sort -u links.txt -o links.txt
          n=0; while read -r u; do case "$u" in //*) u="https:$u";; /*) u="https://ciram.epagri.sc.gov.br$u";; http*) ;; *) u="https://ciram.epagri.sc.gov.br/$u";; esac
            n=$((n+1)); [ $n -gt 60 ] && break
            f="r_$(echo "$u" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-120)"; g "$f" "$u"; done < links.txt
          ls -la >> log.txt
      - name: Grava no branch "pesquisa"
        run: |
          cd p && git init -q -b pesquisa && git add -A
          git -c user.name=mare-boa-bot -c user.email=mare-boa-bot@users.noreply.github.com commit -qm "pesquisa $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" pesquisa
